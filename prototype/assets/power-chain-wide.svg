<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" class="pchain pchain-wide">
<title>Power chain from grid to load with condition-monitoring points</title>
<style>
.pchain{font-family:var(--display,Jost,"Segoe UI",Arial,sans-serif)}
.pchain .wire{fill:none;stroke:var(--navy,#1a315e);stroke-width:2}
.pchain .bus{fill:none;stroke:var(--navy,#1a315e);stroke-width:6}
.pchain .sym{fill:none;stroke:var(--navy,#1a315e);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pchain .sym.b{fill:var(--paper,#fff)}
.pchain .sym.cab{stroke-width:5;stroke-linecap:butt}
.pchain .solid{fill:var(--navy,#1a315e)}
.pchain .lbl{fill:var(--navy,#1a315e);font-size:var(--pc-label-size,14px);font-weight:500;text-anchor:middle}
.pchain .lbl.s{text-anchor:start}
.pchain .ctx .lbl{fill:var(--body,#585858);font-weight:400}
.pchain .ltr{fill:var(--navy,#1a315e);font-size:15px;font-weight:600;text-anchor:middle}
.pchain .hit{fill:var(--cyan,#2fc1ff);fill-opacity:0;stroke:var(--cyan,#2fc1ff);stroke-opacity:0;stroke-width:1.5}
.pchain .frame{fill:none;stroke:var(--pc-frame,#8a97b0);stroke-width:1.5;stroke-dasharray:6 5;pointer-events:none}
.pchain .tab{fill:var(--soft,#f4f6fa);stroke:var(--pc-frame,#8a97b0);stroke-width:1.5}
.pchain .mp-dot{fill:var(--cyan,#2fc1ff);stroke:var(--paper,#fff);stroke-width:1.5}
.pchain .mp-ring{fill:none;stroke:var(--cyan,#2fc1ff);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.pchain .node{cursor:pointer;outline:none;transition:opacity .2s}
.pchain .node:hover .hit,.pchain .node:focus-visible .hit{fill-opacity:.1}
.pchain .node:focus-visible .hit{stroke:var(--cyan-text,#0077a8);stroke-opacity:1;stroke-width:2}
.pchain .node:hover .tab{fill:var(--line,#dde2ec)}
.pchain .node:focus-visible .tab{stroke:var(--cyan-text,#0077a8);stroke-width:2.5}
.pchain .node.is-active .hit{fill-opacity:.16;stroke-opacity:1}
.pchain .node.is-active .sym,.pchain .node.is-active .wire{stroke-width:3}
.pchain .node.is-active .sym.cab{stroke-width:7}
.pchain .node.is-active .bus{stroke-width:8}
.pchain .node.is-active .sym.o{fill:var(--cyan,#2fc1ff);fill-opacity:.3}
.pchain .node.is-active .sym.b{fill:var(--pc-active-fill,#bfeaff)}
.pchain .node.is-active .lbl{font-weight:600}
.pchain .node.is-active .frame{stroke:var(--cyan,#2fc1ff);stroke-width:3;stroke-dasharray:none}
.pchain .node.is-active .tab{fill:var(--cyan,#2fc1ff);stroke:var(--cyan,#2fc1ff)}
.pchain .node.is-active .mp-ring{opacity:.9}
.pchain .node.is-active .mp-dot{stroke:var(--navy,#1a315e)}
.pchain .node.is-dim{opacity:.35}
.pchain .hit.x{fill-opacity:0!important;stroke-opacity:0!important}
@media (prefers-reduced-motion:no-preference){.pchain .node.is-active .mp-ring{animation:pc-pulse 2.4s ease-out infinite}}
@keyframes pc-pulse{0%{transform:scale(.6);opacity:.9}75%,100%{transform:scale(1.9);opacity:0}}
</style>
<g id="n-fleet" class="node" data-node="fleet">
<rect class="frame" x="20" y="50" width="1060" height="310"/>
<rect class="tab" x="20" y="22" width="136" height="28"/>
<rect class="hit x" x="20" y="8" width="136" height="48"/>
<g class="mp" transform="translate(36 36)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl s" x="50" y="41">Whole fleet</text>
</g>
<g class="ctx">
<path class="sym" d="M69 268 80 196l11 72M68 212h24M62 230h36M72 250h16"/>
<text class="lbl" x="80" y="300">Grid</text>
</g>
<path class="wire" d="M98 230h62M290 230h59M421 230h134M705 230h86M839 230h86M480 105h34M480 160h34"/>
<path class="bus" d="M480 85v177"/>
<g class="ctx">
<path class="wire" d="M925 208h60M925 230h60M925 252h60"/>
<path class="solid" d="M985 203l10 5-10 5zM985 225l10 5-10 5zM985 247l10 5-10 5z"/>
<text class="lbl s" x="1008" y="235">Loads</text>
</g>
<g id="n-hv-cable" class="node" data-node="hv-cable">
<rect class="hit" x="150" y="192" width="150" height="140"/>
<path class="sym cab" d="M174 230h102"/>
<path class="sym b" d="M160 222v16l14-8zM290 222v16l-14-8zM214 222h22v16h-22z"/>
<g class="mp" transform="translate(236 222)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl" x="225" y="300">HV cable<tspan x="225" dy="17">circuit</tspan></text>
</g>
<g id="n-power-transformer" class="node" data-node="power-transformer">
<rect class="hit" x="325" y="192" width="120" height="140"/>
<circle class="sym o" cx="371" cy="230" r="22"/><circle class="sym o" cx="399" cy="230" r="22"/>
<g class="mp" transform="translate(414.5 214.5)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl" x="385" y="300">Power<tspan x="385" dy="17">transformer</tspan></text>
</g>
<g id="n-rotating" class="node" data-node="rotating">
<rect class="hit" x="498" y="76" width="166" height="110"/>
<circle class="sym o" cx="532" cy="105" r="18"/><circle class="sym o" cx="532" cy="160" r="18"/>
<text class="ltr" x="532" y="110">G</text><text class="ltr" x="532" y="165">M</text>
<g class="mp" transform="translate(545 92)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl s" x="564" y="129">Generator &amp;<tspan x="564" dy="17">HV motor</tspan></text>
</g>
<g id="n-mv-feeder" class="node" data-node="mv-feeder">
<rect class="hit" x="540" y="192" width="180" height="140"/>
<path class="sym" d="M555 230q37.5 16 75 0 37.5 16 75 0M555 230v46M630 230v46M705 230v46M548 276h14M623 276h14M698 276h14"/>
<path class="solid" d="M552 223h6v8h-6zM627 223h6v8h-6zM702 223h6v8h-6z"/>
<g class="mp" transform="translate(667.5 238)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl" x="630" y="300">MV overhead<tspan x="630" dy="17">feeder</tspan></text>
</g>
<g id="n-dist-transformer" class="node" data-node="dist-transformer">
<rect class="hit" x="754" y="192" width="120" height="140"/>
<circle class="sym o" cx="806" cy="230" r="15"/><circle class="sym o" cx="824" cy="230" r="15"/>
<g class="mp" transform="translate(834.6 219.4)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl" x="815" y="300">Distribution<tspan x="815" dy="17">transformer</tspan></text>
</g>
<g id="n-supply-point" class="node" data-node="supply-point">
<rect class="hit" x="876" y="192" width="100" height="140"/>
<path class="sym b" d="M884 225h10v10h-10z"/>
<path class="bus" d="M925 196v68"/>
<g class="mp" transform="translate(925 196)"><circle class="mp-ring" r="8"/><circle class="mp-dot" r="4"/></g>
<text class="lbl" x="926" y="300">Supply point /<tspan x="926" dy="17">busbar</tspan></text>
</g>
</svg>
