<!doctype html>
<html lang="{{lang}}" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#0B1220">
  <meta property="og:site_name" content="{{site_name}}">
  <meta property="og:type" content="{{og_type}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:locale" content="{{og_locale}}">
  <meta property="og:image" content="{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  {{head_extra}}
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}assets/css/fonts.css">
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
  <link rel="stylesheet" href="{{root}}assets/css/viz.css">
  <link rel="stylesheet" href="{{root}}assets/css/pages-monitoring.css">
  <link rel="stylesheet" href="{{root}}assets/css/pages-sectors-supply.css">
  <link rel="stylesheet" href="{{root}}assets/css/pages-editorial.css">
  <script src="{{root}}assets/js/editorial.js" defer></script>
  <script>document.documentElement.className = document.documentElement.className.replace('no-js', 'js');</script>
</head>
<body class="{{body_class}}" data-nav="{{nav}}" data-slug="{{slug}}" data-header="{{header_theme}}">
{{icon_sprite}}
<a class="skip-link" href="#main">{{skip}}</a>
{{> header}}
<main id="main" tabindex="-1">
{{content}}
</main>
{{> footer}}
<script src="{{root}}assets/js/site.js" defer></script>{{scripts}}
</body>
</html>
